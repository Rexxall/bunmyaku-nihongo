name: tests

on:
  push:
  pull_request:

jobs:
  server:
    name: server · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.x']
        exclude:
          # Python 3.9 has no build for the arm64 macOS runners or for Ubuntu 26.04 (ubuntu-latest);
          # it runs on Windows and on Ubuntu 24.04 instead.
          - os: macos-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate the demo pack
        run: python tools/validate_pack.py examples/demo-pack --strict
      - name: Server, release, tool and launcher tests
        run: python -m unittest -v
      - name: Start script (macOS / Linux)
        if: runner.os != 'Windows'
        run: sh bunmyaku.command --version
      - name: Start script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo.| bunmyaku.bat --version

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start the demo server
        run: |
          python3 serve.py --port 8766 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/api/status >/dev/null && break; sleep 1; done
      - name: Browser tests
        env:
          STUDY_URL: http://127.0.0.1:8766/
        run: |
          node test_browser.cjs
          node test_learning.cjs
          node test_resume.cjs
          node test_layout.cjs
