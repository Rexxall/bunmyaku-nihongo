name: tests

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the demo pack
        run: python3 tools/validate_pack.py examples/demo-pack --strict
      - name: Server, release and tool tests
        run: python3 -m unittest -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start the demo server
        run: |
          python3 serve.py --port 8766 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/api/status >/dev/null && break; sleep 1; done
      - name: Browser tests
        env:
          STUDY_URL: http://127.0.0.1:8766/
        run: |
          node test_browser.cjs
          node test_learning.cjs
          node test_resume.cjs
          node test_layout.cjs
