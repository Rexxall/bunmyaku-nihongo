<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Bunmyaku</title>
<style>
/* A settings page is content, so it is solid (no glass): one grouped list, the note under it, one main button.
   Tokens follow the study desk's glass layer; light and dark follow the system. */
:root{--page:#f5f5f7;--group:#fff;--label:#1d1d1f;--label-2:#6e6e73;--sep:rgb(0 0 0 / .11);--field:rgb(0 0 0 / .05);--accent:#0071e3;--accent-tint:rgb(0 113 227 / .14);--good:#248a3d;--bad:#d70015}
@media(prefers-color-scheme:dark){:root{--page:#1c1c1e;--group:#2c2c2e;--label:#f5f5f7;--label-2:#a1a1a6;--sep:rgb(255 255 255 / .14);--field:rgb(255 255 255 / .08);--accent-tint:rgb(41 151 255 / .3);--good:#30d158;--bad:#ff6961}}
@media(prefers-contrast:more){:root{--sep:rgb(128 128 128 / .6);--label-2:var(--label)}}
body{margin:0;padding:20px;min-width:340px;background:var(--page);color:var(--label);font:13px/18px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
form{display:grid;gap:8px;max-width:520px}
.group{background:var(--group);border-radius:12px;box-shadow:0 0 0 .5px var(--sep);padding:12px 16px;display:grid;gap:8px}
label{font-weight:600}
input{box-sizing:border-box;width:100%;padding:7px 12px;border:0;border-radius:10px;background:var(--field);color:var(--label);font:inherit;box-shadow:inset 0 0 0 .5px var(--sep)}
input:focus{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-tint)}
.note{margin:0;padding:0 4px;color:var(--label-2);font-size:12px;line-height:16px}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:4px}
button{appearance:none;border:0;border-radius:999px;padding:6px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 rgb(255 255 255 / .25);transition:background 120ms cubic-bezier(.2,.8,.2,1),transform 120ms cubic-bezier(.2,.8,.2,1)}
button:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{margin:0;min-height:18px;color:var(--good)}
#status.error{color:var(--bad)}
@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head><body>
<form id="form">
<div class="group">
<label for="desk" data-msg="deskLabel"></label>
<input id="desk" type="url" required spellcheck="false" autocomplete="off">
</div>
<p class="note" data-msg="deskHelp"></p>
<div class="actions"><p id="status" role="status"></p><button type="submit" data-msg="save"></button></div>
</form>
<script src="options.js"></script>
</body></html>
